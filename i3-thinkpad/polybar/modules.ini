[module/battery]
type = custom/script
exec = apm -l
interval = 5
format-prefix = " | Battery: "
label = %output%%

[module/rembat]
type = custom/script
exec = apm | grep -m 1 "time" | grep -o '[^Remaining battery ]\+$'
interval = 5
format-prefix = " | Battery Time: "
label = %output%

[module/ram]
type = internal/memory
interval = 5
label =" | Ram %gb_used%/%gb_total%"
[module/cpu]
type = internal/cpu
format = <label> <ramp-coreload>
label = " | CPU %percentage%%"
ramp-coreload-spacing = 1
ramp-coreload-0 = %{F#0a0}▁%{F-}
ramp-coreload-1 = %{F#0a0}▂%{F-}
ramp-coreload-2 = %{F#0a0}▃%{F-}
ramp-coreload-3 = %{F#0a0}▄%{F-}
ramp-coreload-4 = %{F#f80}▅%{F-}
ramp-coreload-5 = %{F#f80}▆%{F-}
ramp-coreload-6 = %{F#f00}▇%{F-}
ramp-coreload-7 = %{F#f00}█%{F-}

[module/date]
type = internal/date
interval = 1
date = " | %H:%M:%S"


[module/i3]
type = internal/i3

label-focused = %index%
label-focused-background = #97d07c
label-focused-foreground = #ffffff 
label-focused-underline= ${F#fc7474}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-background = #230f06
label-unfocused-foreground = #ffffff
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.red}
label-urgent-padding = 1

